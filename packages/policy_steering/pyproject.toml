[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[project]
name = "policy-steering"
version = "0.1.0"
description = "Lightweight JAX guidance functions for action-space trajectory correction"
requires-python = ">=3.8"
dependencies = [
    "jax>=0.4.0",
    "numpy>=1.22.0",
    "pyyaml>=6.0",
]

[tool.setuptools.package-data]
policy_steering = ["configs/*.yaml"]
